name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # see every Python version's result, not just the first failure
      matrix:
        # 3.10 resolves to pandas 2.x and 3.12 to pandas 3.x, so both majors stay tested.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # Includes tests/test_no_lookahead.py: a strategy that peeks at future bars fails here.
      - name: Test
        if: ${{ !cancelled() }}  # run even when lint fails, so a style nit never hides a real failure
        run: python -m pytest
