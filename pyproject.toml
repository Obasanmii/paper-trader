[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrader"
version = "0.1.0"
description = "A small, careful paper-trading research stack: clean data, honest backtests, an independent risk layer, a full audit log."
readme = "README.md"
requires-python = ">=3.10"
# Upper bounds stop a future major release from silently changing results.
# Raise one only after the full test suite passes on the new version.
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "scikit-learn>=1.3,<2",
    "matplotlib>=3.7,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40,<2"]
# ruff promotes new rules in minor releases, so it is pinned to the tested minor to keep CI reproducible.
dev = ["pytest>=7,<10", "ruff>=0.16,<0.17"]

[project.scripts]
papertrader = "papertrader.cli:main"

[tool.setuptools.packages.find]
include = ["papertrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# B905 (zip() without strict=): every zip here pairs sequences that are equal-length by
# construction (a frame's columns with one of its rows, grid keys with their product).
ignore = ["B905"]

[tool.ruff.lint.isort]
# Tests import shared helpers with `from conftest import ...`; sort that next to our own code.
known-first-party = ["papertrader", "conftest"]
