[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrader"
version = "0.1.0"
description = "A small, careful paper-trading research stack: clean data, honest backtests, an independent risk layer, a full audit log."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
dev = ["pytest>=7"]

[project.scripts]
papertrader = "papertrader.cli:main"

[tool.setuptools.packages.find]
include = ["papertrader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
